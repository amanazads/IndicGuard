models:
  - name: qwen_3b
    provider: ollama
    model: qwen2.5:3b
    thinking: false
    description: "Qwen 2.5 3B Instruct running locally via Ollama"
    options:
      temperature: 0.7
      num_predict: 512
      num_ctx: 2048

  - name: qwen_4b
    provider: ollama
    model: qwen3.5:4b
    thinking: false
    description: "Qwen 3.5 4B Q4 running locally via Ollama (Thinking suppressed)"
    options:
      temperature: 0.7
      num_predict: 512
      num_ctx: 2048

  - name: qwen_9b
    provider: ollama
    model: qwen3.5:9b
    thinking: false
    description: "Qwen 3.5 9B Q4 running locally via Ollama (Thinking suppressed) -- PS-1 primary candidate"
    options:
      temperature: 0.7
      num_predict: 512
      num_ctx: 2048

  - name: gemini_baseline
    provider: gemini
    model: gemini-flash-latest
    description: "Google Gemini Flash as hosted baseline"
    options:
      temperature: 0.7
      max_output_tokens: 512

judge:
  # Local Qwen judge -- keeps Gemini strictly as the single declared hosted
  # baseline (Section "Models and endpoints" of the challenge rules) rather
  # than also using it as the scorer for every response. temperature is 0.0
  # (not 0.7) because a judge should be deterministic, not creative.
  # NOTE: Ollama's API reads `num_predict`/`num_ctx`, not `max_output_tokens`
  # (that key is Gemini-specific) -- use the same option names as the
  # `models:` entries above so this actually takes effect.
  name: judge_qwen_local
  provider: ollama
  model: qwen3.5:2b
  thinking: false
  options:
    temperature: 0.0
    num_predict: 1024
    num_ctx: 4096

benchmark:
  default_lender: "FinServe Capital"
  default_name: "Ravi Kumar"
  default_dpd: 45
  default_product: "personal loan"
  default_amount: "₹52,000"
  timeout_seconds: 60
  max_retries: 3
  results_dir: "results"
  save_raw_responses: true
